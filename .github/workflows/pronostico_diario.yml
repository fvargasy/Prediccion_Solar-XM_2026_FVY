name: ☀️ Pronóstico diario

on:
  schedule:
    - cron: "0 12 * * *"        # 07:00 hora Colombia, todos los días
  workflow_dispatch:             # botón "Run workflow" en la pestaña Actions
    inputs:
      backtest:
        description: "Días de backtest (0 = no)"
        default: "0"

permissions:
  contents: write

concurrency: liga

jobs:
  liga:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias (PyTorch CPU, más liviano)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Correr la liga
        run: python -m liga.run_diario --backtest ${{ github.event.inputs.backtest || 0 }}
      - name: Publicar resultados
        run: |
          git config user.name  "liga-bot"
          git config user.email "liga-bot@users.noreply.github.com"
          git add datos predicciones resultados LEADERBOARD.md
          git commit -m "☀️ Pronóstico y leaderboard $(date -u +%F)" || echo "Sin cambios"
          git push
